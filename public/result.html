<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Results — SMART Q-GEN</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .main { padding: 24px; max-width: 900px; margin: 0 auto; }
    .answer-row { border-bottom: 1px solid var(--border); padding: 16px 0; }
    .answer-row:last-child { border-bottom: none; }
    .answer-q { font-size: .9rem; font-weight: 600; margin-bottom: 10px; }
    .answer-opts { display: flex; flex-direction: column; gap: 6px; }
    .opt-line { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-radius: 6px; font-size: .82rem; border: 1px solid transparent; }
    .opt-line.correct-ans { background: rgba(16,185,129,.1); border-color: var(--success); }
    .opt-line.wrong-sel { background: rgba(239,68,68,.1); border-color: var(--danger); }
    .opt-mark { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: .72rem; font-weight: 800; flex-shrink: 0; }
    .correct-mark { background: var(--success); color: #fff; }
    .wrong-mark { background: var(--danger); color: #fff; }
    .neutral-mark { background: var(--surface2); color: var(--dim); }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .card, .stat-card { background: #fff; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
<nav class="navbar no-print">
  <span class="navbar-brand">⚡ SMART Q-GEN</span>
  <div class="navbar-actions">
    <a href="/student.html" class="btn btn-secondary btn-sm">← Dashboard</a>
    <button class="btn btn-primary btn-sm" onclick="downloadReport()">⬇ Download Report</button>
  </div>
</nav>

<div class="main" id="mainContent">
  <div id="loadMsg" style="text-align:center;padding:60px;color:var(--dim);">Loading results…</div>
  <div id="resultContent" class="hidden"></div>
</div>

<div id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/result.js"></script>
</body>
</html>
