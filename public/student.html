<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Student Portal — SMART Q-GEN</title>
 <link rel="stylesheet" href="/css/style.css">
 <style>
 .main { padding: 24px; max-width: 900px; margin: 0 auto; }
 .join-card { max-width: 500px; margin: 0 auto 32px; }
 .history-empty { text-align:center; padding: 40px; color: var(--dim); }
 </style>
</head>
<body>
<nav class="navbar">
 <span class="navbar-brand"> SMART Q-GEN</span>
 <div class="navbar-actions">
 <span class="user-chip" id="user-chip">Loading…</span>
 <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
 </div>
</nav>

<div class="main">
 <!-- Join Exam -->
 <div class="card join-card">
 <h3 style="margin-bottom:16px;">Join an Exam</h3>
 <div class="form-group">
 <label>Paste Exam Link or Code</label>
 <input type="text" class="form-control" id="examLinkInput"
 placeholder="https://…/exam/xxxxxxxx-xxxx or just the code">
 </div>
 <div style="display:flex;gap:10px;">
 <button class="btn btn-primary" style="flex:1" onclick="joinExam()"> Join Exam</button>
 <button class="btn btn-secondary" onclick="openScanner()" title="Scan QR Code"> Scan QR</button>
 </div>
 <div id="joinMsg" class="mt-2"></div>
 </div>

 <!-- QR Scanner Modal -->
 <div id="scanModal" class="modal-overlay hidden">
 <div class="modal">
 <div class="modal-header">
 <h3>Scan Exam QR Code</h3>
 <button class="btn btn-secondary btn-sm" onclick="closeScanner()"></button>
 </div>
 <video id="scanVideo" style="width:100%;border-radius:8px;background:#000;" autoplay playsinline></video>
 <p class="text-sm mt-2 text-center" style="color:var(--dim);">Point your camera at the exam QR code</p>
 </div>
 </div>

 <!-- My Submissions -->
 <div>
 <div class="flex justify-between items-center mb-3">
 <h3>My Past Exams</h3>
 <button class="btn btn-secondary btn-sm" onclick="loadHistory()">↻ Refresh</button>
 </div>
 <div id="historyList"></div>
 </div>
</div>

<div id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/student.js"></script>
<script>
document.addEventListener("input", function(e) {
 if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") {
 if (e.target.value && e.target.value !== "0" && e.target.value.trim() !== "") {
 e.target.classList.add("filled-state");
 } else {
 e.target.classList.remove("filled-state");
 }
 }
});
</script>
</body>
</html>
